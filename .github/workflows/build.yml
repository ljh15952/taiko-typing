name: Build memo.exe

on:
  push:
    tags: ["v*"]        # v1.0.0 같은 태그를 올리면 빌드 + 릴리스
  workflow_dispatch:    # Actions 화면에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe (no console)
        run: pyinstaller --onefile --windowed --name memo donka_memo.py

      - uses: actions/upload-artifact@v4
        with:
          name: memo-windows
          path: dist/memo.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/memo.exe
